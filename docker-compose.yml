services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qc_db}
      POSTGRES_USER: ${POSTGRES_USER:-qc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qc} -d ${POSTGRES_DB:-qc_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:-ubah-secret-key-ini}
      # Container selalu berjalan sebagai produksi. DEBUG hanya untuk runserver lokal.
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-qc}:${POSTGRES_PASSWORD:-qc}@db:5432/${POSTGRES_DB:-qc_db}
      QC_DEFECT_RATE_THRESHOLD: ${QC_DEFECT_RATE_THRESHOLD:-3.0}
      SEED_DEMO: ${SEED_DEMO:-1}
      SEED_DAYS: ${SEED_DAYS:-30}
      TZ: Asia/Jakarta
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
