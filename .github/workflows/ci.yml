name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qc_db
          POSTGRES_USER: qc
          POSTGRES_PASSWORD: qc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://qc:qc@localhost:5432/qc_db
      QC_DEFECT_RATE_THRESHOLD: "3.0"
      TZ: Asia/Jakarta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Check konfigurasi Django
        run: python manage.py check --deploy --fail-level ERROR

      - name: Migrasi database
        run: python manage.py migrate --noinput

      - name: Jalankan tes
        run: |
          coverage run --source=apps manage.py test apps
          coverage report --fail-under=70

      - name: Build image Docker
        run: docker build -t qcms:ci .
